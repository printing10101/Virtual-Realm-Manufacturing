# 灵境制造 - CNC后处理器配置文件
# ============================================================
# 通过此文件配置目标CNC控制器类型及后处理参数，
# 无需修改代码即可切换不同控制器的G代码方言。

target_controller: fanuc_0i      # 目标控制器类型，可选值：fanuc_0i, siemens_840d, heidenhain_tnc

# --- 输出精度控制 ---
decimal_places: 3                # 数值保留小数位数

# --- 加工安全参数 ---
safe_z_height: 50.0              # 安全Z轴高度(mm)

# --- 速度控制 ---
rapid_feed: 10000                # 快速进给速度(mm/min)
