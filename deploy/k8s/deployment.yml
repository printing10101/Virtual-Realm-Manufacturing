apiVersion: apps/v1
kind: Deployment
metadata:
  name: lnn-api
  labels:
    app: lnn-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lnn-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: lnn-api
    spec:
      # 安全修复：Pod 级 securityContext，强制非 root 运行
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lnn-api
          # 安全修复：使用固定版本标签替代 latest，确保可追溯与可复现
          image: lnn-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8765
              name: http
          # 安全修复：容器级 securityContext，禁止特权与能力提升
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: APP_ENV
              value: "production"
            - name: PORT
              value: "8765"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: lnn-secrets
                  key: redis-url
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: lnn-secrets
                  key: db-url
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8765
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: models-volume
              mountPath: /app/models/lnn
            - name: logs-volume
              mountPath: /app/logs
      volumes:
        - name: models-volume
          persistentVolumeClaim:
            claimName: lnn-models-pvc
        - name: logs-volume
          persistentVolumeClaim:
            claimName: lnn-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: lnn-api-service
spec:
  type: ClusterIP
  selector:
    app: lnn-api
  ports:
    - port: 80
      targetPort: 8765
      protocol: TCP
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lnn-config
data:
  # 仅放非敏感配置；敏感信息（redis-url、db-url）改由 Secret 注入
  app-env: "production"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lnn-models-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lnn-logs-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
