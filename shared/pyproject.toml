[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lingjing-shared"
version = "0.1.0"
description = "灵境制造 — 科研侧与工程侧共享的薄契约层（零重依赖）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "灵境制造项目组" },
]
# 零重依赖：仅允许 stdlib + typing_extensions
# 严禁 torch / numpy / pydantic / scikit-learn
dependencies = [
    "typing_extensions>=4.0; python_version < '3.12'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]
