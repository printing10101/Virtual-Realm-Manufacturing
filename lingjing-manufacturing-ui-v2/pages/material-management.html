<style id="theme-vars">
/*
 * Lingjing Manufacturing design tokens
 * Brand: Lingjing Manufacturing
 * Domain: Intelligent manufacturing platform
 * Style: Restrained, elegant, warm cream/off-white palette
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  /* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #faf8f5;
  --background-100: #f5f2ed;
  --background-200: #ede9e3;
  --background-300: #e0dbd4;
  --background-400: #cec8bf;
  --background-500: #a8a199;
  --background-600: #8a847c;
  --background-700: #3a3632;
  --background-800: #1c1a18;
  --background-900: #0e0d0c;

  /* text */
  --text-50: #f5f2ed;
  --text-100: #e3dfd8;
  --text-200: #c7c2b8;
  --text-300: #aea99f;
  --text-400: #8e897f;
  --text-500: #6e6960;
  --text-600: #48443e;
  --text-700: #3c3832;
  --text-800: #1d1b18;
  --text-900: #0e0d0c;

  /* icon */
  --icon-50: #f5f2ed;
  --icon-100: #e0dbd4;
  --icon-200: #cec8bf;
  --icon-300: #c7c2b8;
  --icon-400: #aea99f;
  --icon-500: #8e897f;
  --icon-600: #6e6960;
  --icon-700: #48443e;
  --icon-800: #2c2926;
  --icon-900: #1d1b18;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f5ec;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #fdecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
  /* ===== COLOR ALIAS LAYER (--color-*) ===== */
  --color-bg-50: var(--background-50);
  --color-bg-100: var(--background-100);
  --color-bg-200: var(--background-200);
  --color-bg-300: var(--background-300);
  --color-text-primary: var(--text-800);
  --color-text-secondary: var(--text-500);
  --color-text-tertiary: var(--text-400);
  --color-text-muted: var(--text-400);
  --color-text-placeholder: var(--text-300);
  --color-text-inverse: var(--background-50);
  --color-border-subtle: var(--background-300);
  --color-border-default: var(--background-300);
  --color-border-strong: var(--background-500);
  --color-border-focus: var(--brand-500);
  --color-primary-50: var(--brand-50);
  --color-primary-100: var(--brand-100);
  --color-primary-200: var(--brand-200);
  --color-primary-300: var(--brand-300);
  --color-primary-400: var(--brand-400);
  --color-primary-500: var(--brand-500);
  --color-primary-600: var(--brand-600);
  --color-primary-700: var(--brand-700);
  --color-primary-800: var(--brand-800);
  --color-brand-400: var(--brand-400);
  --color-brand-500: var(--brand-500);
  --color-brand-800: var(--brand-800);
  /* ===== LAYOUT VARIABLES ===== */
  --sidebar-width: 240px;
  --header-height: 56px;
  --page-padding: 24px;
  --content-max-width: 1200px;
  /* ===== STATE COLORS ===== */
  --state-warning: #ff9500;
  --state-warning-bg: #fff4e5;
  --state-warning-surface: #fff4e5;
  --state-info: #007aff;
  --state-info-bg: #e8f2ff;
  --state-success-bg: #e9f5ec;
  --state-error-bg: #fdecea;
  --card-background: var(--background-50);


}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

html.dark, html.dark body, html.dark * {
  --background: #faf8f5 !important; --foreground: #1d1b18 !important; --card: #faf8f5 !important; --card-foreground: #1d1b18 !important; --card-background: #faf8f5 !important; --popover: #f5f2ed !important; --popover-foreground: #1d1b18 !important; --primary: #007aff !important; --primary-foreground: #ffffff !important; --secondary: #f5f2ed !important; --secondary-foreground: #1d1b18 !important; --muted: #f5f2ed !important; --muted-foreground: #6b6560 !important; --accent: #ede9e3 !important; --accent-foreground: #1d1b18 !important; --border: #e0dbd4 !important; --input: #e0dbd4 !important; --icon: #1d1b18 !important; --icon-muted: #8e897f !important; --sidebar: #ede9e3 !important; --sidebar-foreground: #1d1b18 !important; --sidebar-primary: #007aff !important; --sidebar-primary-foreground: #faf8f5 !important; --sidebar-accent: #e0dbd4 !important; --sidebar-accent-foreground: #1d1b18 !important; --sidebar-border: #e0dbd4 !important; --sidebar-ring: #007aff !important; color: inherit !important;
}

                                supplier: m.supplier || ''
                            };
                        });
                        // Trigger a custom event that the existing script can listen to
                        window.__apiMaterials = mapped;
                        window.dispatchEvent(new CustomEvent('materials-loaded'));
                    }
                }

            // === Fetch Summary Stats ===
            try {
                var statsData = await apiGet('/api/v1/materials/stats/summary');

      function applySorting() {
        if (!sortKey) return;
        filteredData.sort(function(a, b) {
          var va = a[sortKey], vb = b[sortKey];
          if (typeof va === 'number') return sortDir === 'asc' ? va - vb : vb - va;
          va = String(va); vb = String(vb);
          return sortDir === 'asc' ? va.localeCompare(vb, 'zh') : vb.localeCompare(va, 'zh');
        });
      }
      document.querySelectorAll('.sort-header').forEach(function(th) {
        th.addEventListener('click', function() {
          var key = th.getAttribute('data-key');
          if (sortKey === key) {
            sortDir = sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            sortKey = key;
            sortDir = 'asc';
          }
          document.querySelectorAll('.sort-header').forEach(function(h) { h.classList.remove('sort-active'); });
          th.classList.add('sort-active');
          applyFilters();
        });
      });

      /* ===== RENDER TABLE ===== */
      function renderTable() {
        var tbody = document.getElementById('table-body');
        var noResults = document.getElementById('no-results');
        var totalPages = Math.max(1, Math.ceil(filteredData.length / perPage));
        if (currentPage > totalPages) currentPage = totalPages;
        var start = (currentPage - 1) * perPage;
        var pageData = filteredData.slice(start, start + perPage);

        if (filteredData.length === 0) {
          tbody.innerHTML = '';
          noResults.classList.remove('hidden');
          noResults.classList.add('flex');
        } else {
          noResults.classList.add('hidden');
          noResults.classList.remove('flex');
          var html = '';
          pageData.forEach(function(m, i) {
            var idx = materials.indexOf(m);
            var bg = i % 2 === 1 ? 'background:var(--accent);' : '';
            html += '<tr class="transition-colors" style="' + bg + 'border-bottom:1px solid var(--border);">' +
              '<td class="px-5 py-3 whitespace-nowrap font-mono text-xs" style="color:var(--muted-foreground);">' + m.code + '</td>' +
              '<td class="px-5 py-3 truncate" style="color:var(--foreground);min-width:120px;">' + m.name + '</td>' +
              '<td class="px-5 py-3 truncate" style="color:var(--muted-foreground);min-width:100px;">' + m.spec + '</td>' +
              '<td class="px-5 py-3 whitespace-nowrap"><span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium whitespace-nowrap" style="' + getCategoryStyle(m.category) + '">' + m.category + '</span></td>' +
              '<td class="px-5 py-3 text-right whitespace-nowrap font-mono" style="color:var(--foreground);">' + m.quantity.toLocaleString() + '</td>' +
              '<td class="px-5 py-3 text-right whitespace-nowrap font-mono" style="color:var(--muted-foreground);">' + m.safeQty.toLocaleString() + '</td>' +
              '<td class="px-5 py-3 whitespace-nowrap"><span class="inline-flex items-center gap-1.5 text-xs"><span class="w-2 h-2 rounded-full shrink-0" style="' + getStatusDot(m.status) + '"></span>' + m.status + '</span></td>' +
              '<td class="px-5 py-3 truncate" style="color:var(--muted-foreground);min-width:80px;">' + m.location + '</td>' +
              '<td class="px-5 py-3 whitespace-nowrap text-center"><div class="flex items-center justify-center gap-2">' +
                '<button class="text-xs transition-colors" style="color:var(--primary);" data-action="view" data-idx="' + idx + '">查看</button>' +
                '<button class="text-xs transition-colors" style="color:var(--muted-foreground);" data-action="edit" data-idx="' + idx + '">调整</button>' +
                '<button class="text-xs transition-colors" style="color:var(--muted-foreground);" data-action="outbound" data-idx="' + idx + '">出库</button>' +
              '</div></td></tr>';
          });
          tbody.innerHTML = html;
        }

        document.getElementById('total-count').textContent = '共 ' + filteredData.length + ' 条记录';
        renderPagination(totalPages);
              }

      /* ===== PAGINATION ===== */
      function renderPagination(totalPages) {
        var nav = document.getElementById('pagination-nav');
        var html = '<button class="w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-colors" style="color:var(--muted-foreground);background:var(--background);" data-page="prev" ' + (currentPage <= 1 ? 'disabled' : '') + '><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m15 18-6-6 6-6"/></svg></button>';

        var pages = [];
        if (totalPages <= 7) {
          for (var i = 1; i <= totalPages; i++) pages.push(i);
        } else {
          pages.push(1);
          if (currentPage > 3) pages.push('...');
          var s = Math.max(2, currentPage - 1);
          var e = Math.min(totalPages - 1, currentPage + 1);
          for (var j = s; j <= e; j++) pages.push(j);
          if (currentPage < totalPages - 2) pages.push('...');
          pages.push(totalPages);
        }

        pages.forEach(function(p) {
          if (p === '...') {
            html += '<span class="w-8 h-8 flex items-center justify-center text-xs" style="color:var(--muted-foreground);">...</span>';
          } else {
            var active = p === currentPage ? ' page-active' : '';
            html += '<button class="w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-colors' + active + '" style="color:var(--foreground);background:var(--background);" data-page="' + p + '">' + p + '</button>';
          }
        });

        html += '<button class="w-8 h-8 rounded-lg flex items-center justify-center text-xs transition-colors" style="color:var(--muted-foreground);background:var(--background);" data-page="next" ' + (currentPage >= totalPages ? 'disabled' : '') + '><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"/></svg></button>';
        nav.innerHTML = html;

        nav.querySelectorAll('button[data-page]').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var p = btn.getAttribute('data-page');
            var tp = Math.max(1, Math.ceil(filteredData.length / perPage));
            if (p === 'prev') { if (currentPage > 1) currentPage--; }
            else if (p === 'next') { if (currentPage < tp) currentPage++; }
            else { currentPage = parseInt(p); }
            renderTable();
          });
        });
      }

      document.getElementById('rows-per-page').addEventListener('change', function() {
        perPage = parseInt(this.value);
        currentPage = 1;
        renderTable();
      });

      /* ===== ROW ACTIONS ===== */
      document.getElementById('table-body').addEventListener('click', function(e) {
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-action');
        var idx = parseInt(btn.getAttribute('data-idx'));
        var m = materials[idx];
        if (!m) return;

        if (action === 'view') {
          openDetailPanel(m);
        } else if (action === 'edit') {
          openEditModal(m, idx);
        } else if (action === 'outbound') {
          openOutboundPrefilled(m);
        }
      });

      /* ===== DETAIL PANEL ===== */
      function openDetailPanel(m) {
        var overlay = document.getElementById('detail-overlay');
        var panel = document.getElementById('detail-panel');
        var content = document.getElementById('detail-content');
        overlay.classList.remove('hidden');
        setTimeout(function() { panel.classList.add('detail-open'); }, 10);

        content.innerHTML =
          '<div class="space-y-5">' +
            '<div class="flex items-center gap-3 pb-4 border-b" style="border-color:var(--border);">' +
              '<div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background:var(--brand-50);"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--brand-600);flex-shrink:0;"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></div>' +
              '<div><p class="text-sm font-semibold" style="color:var(--popover-foreground);">' + m.name + '</p><p class="text-xs font-mono" style="color:var(--muted-foreground);">' + m.code + '</p></div>' +
            '</div>' +
            '<div class="grid grid-cols-2 gap-4">' +
              field('规格型号', m.spec) + field('分类', '<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium" style="' + getCategoryStyle(m.category) + '">' + m.category + '</span>') +
              field('库存数量', '<span class="font-mono font-semibold" style="color:var(--foreground);">' + m.quantity.toLocaleString() + '</span> <span class="text-xs" style="color:var(--muted-foreground);">' + (m.unit||'件') + '</span>') +
              field('安全库存', '<span class="font-mono" style="color:var(--muted-foreground);">' + m.safeQty.toLocaleString() + '</span>') +
              field('库存状态', '<span class="inline-flex items-center gap-1.5 text-xs"><span class="w-2 h-2 rounded-full shrink-0" style="' + getStatusDot(m.status) + '"></span>' + m.status + '</span>') +
              field('仓库位置', m.location) +
              field('供应商', m.supplier || '-') +
              field('单位', m.unit || '件') +
            '</div>' +
            '<div class="pt-4 border-t" style="border-color:var(--border);">' +
              '<p class="text-xs font-medium mb-2" style="color:var(--muted-foreground);">库存占比</p>' +
              '<div class="w-full h-2 rounded-full overflow-hidden" style="background:var(--muted);">' +
                '<div class="h-full rounded-full transition-all" style="width:' + Math.min(100, Math.round(m.quantity / m.safeQty * 100)) + '%;background:' + (m.status==='正常'?'var(--state-success)':m.status==='低库存'?'#ff9500':'var(--state-error)') + ';"></div>' +
              '</div>' +
              '<p class="text-xs mt-1" style="color:var(--muted-foreground);">' + Math.round(m.quantity / m.safeQty * 100) + '% 安全库存</p>' +
            '</div>' +
          '</div>';
              }
      function field(label, value) {
        return '<div><p class="text-xs mb-1" style="color:var(--muted-foreground);">' + label + '</p><p class="text-sm" style="color:var(--popover-foreground);">' + value + '</p></div>';
      }
      document.getElementById('detail-close').addEventListener('click', closeDetailPanel);
      document.getElementById('detail-overlay').addEventListener('click', function(e) {
        if (e.target === this) closeDetailPanel();
      });
      function closeDetailPanel() {
        var panel = document.getElementById('detail-panel');
        panel.classList.remove('detail-open');
        setTimeout(function() { document.getElementById('detail-overlay').classList.add('hidden'); }, 300);
      }

      /* ===== EDIT MODAL ===== */
      function openEditModal(m, idx) {
        var form = document.getElementById('form-edit');
        form.editIndex.value = idx;
        form.code.value = m.code;
        form.name.value = m.name;
        form.currentQty.value = m.quantity.toLocaleString();
        form.newQty.value = m.quantity;
        form.safeQty.value = m.safeQty;
        form.reason.value = '';
        openModal('modal-edit');
      }
      document.getElementById('form-edit').addEventListener('submit', function(e) {
        e.preventDefault();
        var idx = parseInt(this.editIndex.value);
        var newQty = parseInt(this.newQty.value);
        var newSafe = parseInt(this.safeQty.value);
        if (isNaN(newQty) || newQty < 0) { showToast('请输入有效数量', 'error'); return; }
        materials[idx].quantity = newQty;
        if (!isNaN(newSafe) && newSafe >= 0) materials[idx].safeQty = newSafe;
        materials[idx].status = computeStatus(materials[idx].quantity, materials[idx].safeQty);
        closeModal('modal-edit');
        applyFilters();
        showToast('库存已调整: ' + materials[idx].code, 'success');
      });

      /* ===== OUTBOUND PREFILLED ===== */
      function openOutboundPrefilled(m) {
        var form = document.getElementById('form-outbound');
        form.code.value = m.code;
        document.getElementById('outbound-name').value = m.name;
        form.quantity.value = '';
        form.receiver.value = '';
        form.purpose.value = '';
        form.remark.value = '';
        openModal('modal-outbound');
      }

      /* ===== OUTBOUND CODE AUTO-FILL ===== */
      document.getElementById('outbound-code').addEventListener('input', function() {
        var code = this.value.trim();
        var found = materials.find(function(m) { return m.code === code; });
        document.getElementById('outbound-name').value = found ? found.name : '';
      });

      /* ===== 1. INBOUND ===== */
      document.getElementById('btn-inbound').addEventListener('click', function() {
        var code = 'MAT-2024-' + String(autoCodeCounter).padStart(3, '0');
        var form = document.getElementById('form-inbound');
        form.code.value = code;
        form.name.value = '';
        form.category.value = '';
        form.spec.value = '';
        form.quantity.value = '';
        form.unit.value = '件';
        form.supplier.value = '';
        form.warehouse.value = '';
        form.remark.value = '';
        openModal('modal-inbound');
      });
      document.getElementById('form-inbound').addEventListener('submit', function(e) {
        e.preventDefault();
        var f = this;
        var warehouse = f.warehouse.value;
        var qty = parseInt(f.quantity.value);
        var locMap = { 'A区':'A区-0' + (Math.floor(Math.random()*9)+1) + '-' + String(Math.floor(Math.random()*30)+1).padStart(2,'0'), 'B区':'B区-0' + (Math.floor(Math.random()*9)+1) + '-' + String(Math.floor(Math.random()*30)+1).padStart(2,'0'), 'C区':'C区-0' + (Math.floor(Math.random()*9)+1) + '-' + String(Math.floor(Math.random()*30)+1).padStart(2,'0') };
        var newItem = {
          code: f.code.value,
          name: f.name.value,
          spec: f.spec.value || '-',
          category: f.category.value,
          quantity: isNaN(qty) ? 0 : qty,
          safeQty: Math.round(qty * 0.4),
          status: '正常',
          location: locMap[warehouse] || 'A区-01-01',
          unit: f.unit.value,
          supplier: f.supplier.value || '-'
        };
        newItem.status = computeStatus(newItem.quantity, newItem.safeQty);
        materials.unshift(newItem);
        autoCodeCounter++;
        closeModal('modal-inbound');
        applyFilters();
        showToast('入库成功: ' + newItem.code + ' ' + newItem.name, 'success');
      });

      /* ===== 2. OUTBOUND ===== */
      document.getElementById('btn-outbound').addEventListener('click', function() {
        var form = document.getElementById('form-outbound');
        form.code.value = '';
        document.getElementById('outbound-name').value = '';
        form.quantity.value = '';
        form.receiver.value = '';
        form.purpose.value = '';
        form.remark.value = '';
        openModal('modal-outbound');
      });
      document.getElementById('form-outbound').addEventListener('submit', function(e) {
        e.preventDefault();
        var code = this.code.value.trim();
        var qty = parseInt(this.quantity.value);
        var found = materials.find(function(m) { return m.code === code; });
        if (!found) { showToast('未找到物料: ' + code, 'error'); return; }
        if (isNaN(qty) || qty <= 0) { showToast('请输入有效出库数量', 'error'); return; }
        if (qty > found.quantity) { showToast('出库数量超出库存 (' + found.quantity + ')', 'error'); return; }
        found.quantity -= qty;
        found.status = computeStatus(found.quantity, found.safeQty);
        closeModal('modal-outbound');
        applyFilters();
        showToast('出库申请已提交: ' + code + ' x' + qty, 'success');
      });

      /* ===== 3. INVENTORY CHECK ===== */
      document.getElementById('btn-inventory').addEventListener('click', function() {
        var form = document.getElementById('form-inventory');
        form.checkType.value = '';
        form.checkScope.value = '';
        form.manager.value = '';
        form.remark.value = '';
        openModal('modal-inventory');
      });
      document.getElementById('form-inventory').addEventListener('submit', function(e) {
        e.preventDefault();
        var type = this.checkType.value;
        var scope = this.checkScope.value;
        closeModal('modal-inventory');
        showToast('盘点任务已创建: ' + type + ' - ' + scope, 'success');
      });

      /* ===== 4. EXPORT DROPDOWN ===== */
      var exportBtn = document.getElementById('btn-export');
      var exportDD = document.getElementById('export-dropdown');
      exportBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        exportDD.classList.toggle('hidden');
      });
      document.addEventListener('click', function() { exportDD.classList.add('hidden'); });
      document.querySelectorAll('.export-opt').forEach(function(opt) {
        opt.addEventListener('click', function() {
          var fmt = this.getAttribute('data-format');
          exportDD.classList.add('hidden');
          showToast('正在导出 ' + fmt + ' 文件...', 'info');
        });
      });

      /* ===== INIT ===== */
      applyFilters();
      renderTable();

      /* ===== API Data Integration ===== */
      window.addEventListener('materials-loaded', function() {
        if (window.__apiMaterials && window.__apiMaterials.length > 0) {
          materials = window.__apiMaterials;
          filteredData = materials.slice();
          currentPage = 1;
          autoCodeCounter = materials.length + 1;
          applyFilters();
          renderTable();
        }
      });

    })();
    </script>
    <script>
    (function(){
        var h=document.documentElement,b=document.body;
        h.classList.remove('dark');
        h.style.backgroundColor='#faf8f5';
        h.style.color='#1d1b18';
        b.style.backgroundColor='#faf8f5';
        b.style.color='#1d1b18';
        var mo=new MutationObserver(function(){
            if(h.classList.contains('dark'))h.classList.remove('dark');
            if(h.style.backgroundColor!=='#faf8f5')h.style.backgroundColor='#faf8f5';
            if(h.style.color!=='#1d1b18')h.style.color='#1d1b18';
            if(b.style.backgroundColor!=='#faf8f5')b.style.backgroundColor='#faf8f5';
            if(b.style.color!=='#1d1b18')b.style.color='#1d1b18';
        });
        mo.observe(h,{attributes:true,attributeFilter:['class','style']});
        mo.observe(b,{attributes:true,attributeFilter:['style']});
    })();
    </script>
</body>
</html>
