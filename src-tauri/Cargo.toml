[package]
name = "lingjing-v4"
version = "1.9.0"
description = "灵境制造 V4 - AI驱动的3D建模与工艺规划系统"
edition = "2021"

[package.metadata.tauri-winres]
ProductName = "灵境制造"
FileDescription = "灵境制造 V4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
gethostname = "0.4"
open = "5"
reqwest = { version = "0.11", features = ["json", "stream", "gzip", "brotli", "deflate", "blocking"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.19"
futures = "0.3"
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
