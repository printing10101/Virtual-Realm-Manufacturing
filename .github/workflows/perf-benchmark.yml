name: 性能基准测试与回归检测

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '*.txt'

env:
  PYTHONUNBUFFERED: '1'
  LNN_AUTH_ENABLED: 'false'

jobs:
  perf-benchmark:
    name: 性能基准测试
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pytest-benchmark
          pip install -r requirements.txt 2>/dev/null || true

      - name: Run performance benchmarks
        run: |
          python -m pytest python/app/benchmarks/performance/ \
            --benchmark-only \
            --benchmark-json=perf_results.json \
            --benchmark-min-rounds=3 \
            --benchmark-max-time=2 \
            -v 2>&1 || true

      - name: Run comprehensive benchmark
        run: |
          python python/app/benchmarks/performance/run_perf_benchmark.py

      - name: Check for performance regressions
        id: regression
        run: |
          REPORT=$(find python/app/benchmarks/performance/history -name "regression_report_*.md" -newer perf_results.json | head -1)
          if [ -n "$REPORT" ]; then
            echo "regression_report=$REPORT" >> $GITHUB_OUTPUT
            if grep -q "CRITICAL" "$REPORT"; then
              echo "status=CRITICAL" >> $GITHUB_OUTPUT
            elif grep -q "WARNING" "$REPORT"; then
              echo "status=WARNING" >> $GITHUB_OUTPUT
            else
              echo "status=PASS" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create GitHub Issue on regression
        if: steps.regression.outputs.status == 'CRITICAL'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = process.env.REGRESSION_REPORT || '';
            let body = '## 性能基准测试检测到严重回归\n\n';
            if (report && fs.existsSync(report)) {
              body += fs.readFileSync(report, 'utf8');
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Performance] 检测到严重性能回退',
              body: body,
              labels: ['performance', 'regression', 'bug']
            });

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-benchmark-results
          path: |
            perf_results.json
            python/app/benchmarks/performance/history/*.json
            python/app/benchmarks/performance/history/*.md
          retention-days: 30
