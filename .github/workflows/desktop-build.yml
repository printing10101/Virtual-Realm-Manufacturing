# =============================================================================
# 桌面端构建流水线（P2-4/P2-5 新增，2026-08-03）
# 三平台构建「嵌入式 Python 运行时 + Tauri 桌面安装包」：
#   - Windows  : msi / nsis（自包含运行时，目标机器无需 Python）
#   - Linux    : appimage / deb
#   - macOS    : dmg / app
# 触发：main push（产物上传 Actions artifact）/ 发布 tag（附加到 GitHub Release）
# =============================================================================
name: 桌面端构建

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  desktop-build:
    name: 桌面构建 ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            artifact: lingjing-desktop-windows
          - name: Linux x64
            platform: ubuntu-latest
            artifact: lingjing-desktop-linux
          - name: macOS arm64
            platform: macos-latest
            artifact: lingjing-desktop-macos

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        shell: bash

      - name: 安装 Python ${{ env.PYTHON_VERSION }}（python-build-standalone）
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv python install ${{ env.PYTHON_VERSION }}

      - name: 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装前端依赖
        working-directory: engineering
        run: pnpm install --frozen-lockfile

      - name: 构建嵌入式 Python 运行时
        # 探测 uv 安装的 python-build-standalone → 组装自包含运行时（含依赖与后端代码）
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python engineering/python/scripts/build_desktop_runtime.py --install-deps

      - name: 安装 Rust 工具链（Linux/macOS）
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: 构建桌面安装包
        working-directory: engineering
        run: pnpm tauri build

      - name: 上传桌面安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            engineering/src-tauri/target/release/bundle/msi/*.msi
            engineering/src-tauri/target/release/bundle/nsis/*.exe
            engineering/src-tauri/target/release/bundle/appimage/*.AppImage
            engineering/src-tauri/target/release/bundle/deb/*.deb
            engineering/src-tauri/target/release/bundle/dmg/*.dmg
            engineering/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 30

      - name: 附加到 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            engineering/src-tauri/target/release/bundle/msi/*.msi
            engineering/src-tauri/target/release/bundle/nsis/*.exe
            engineering/src-tauri/target/release/bundle/appimage/*.AppImage
            engineering/src-tauri/target/release/bundle/deb/*.deb
            engineering/src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
