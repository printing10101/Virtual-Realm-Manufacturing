[pytest]
# 测试收集策略（E-20）：
# - ``python/tests`` 为**集中测试目录**，包含所有进入默认 CI 收集的测试。
# - ``app/**/tests/`` 下的内嵌测试为**模块自测**，用于开发时快速验证模块内部
#   功能，不进入默认 testpaths（避免拖慢 CI / 触发环境依赖如 torch/opcua）。
# - 如需运行模块自测，显式指定路径：``pytest python/app/ai/lnn/tests/``。
# - 新增模块自测应评估是否上提到 ``python/tests/`` 以纳入 CI；若保留在模块内，
#   需确保使用绝对导入（``from app.xxx import yyy``），路径推算冗余但不会出错
#   （根 conftest 已将 python/ 加入 sys.path）。
testpaths = python/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 防复发机制 [E-P0-3]：显式排除 app/**/tests/ 内嵌测试目录
# 根因：pytest 9.x 在跨目录调用时，testpaths 解析不一致，会把 cwd 作为收集根
# 递归扫描 python/app/，进入 app/ai/lnn/tests/test_gpu_training.py，
# 该文件顶层 import torch → pandas → pyarrow.compute 触发 STATUS_HEAP_CORRUPTION。
# 双重防护：
#   1. pytest.ini 的 norecursedirs（本行下方）—— ini 级别有效配置
#   2. python/conftest.py 的 collect_ignore = ["app"] —— Python 级别变量
# 注意：collect_ignore 是 conftest.py 专属 Python 变量，写入 pytest.ini 会触发
# PytestConfigWarning: Unknown config option: collect_ignore，因此此处仅保留
# norecursedirs，conftest.py 中保留 collect_ignore。
norecursedirs = .git .venv venv node_modules app
addopts = 
    --strict-markers
    --tb=short
    -v
    --durations=10
    --cov=app
    --cov-config=.coveragerc
    --cov-report=html:coverage-reports/html
    --cov-report=json:coverage-reports/coverage.json
    --cov-report=term-missing:skip-covered
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multi-module, slower)
    regression: Regression tests (baseline comparison)
    slow: Tests that take longer than 5 seconds
    postprocessor: Tests for CNC postprocessor modules
    geometry: Tests for geometric operations
    lnn: Tests for LNN AI modules
    api: Tests for API endpoints
    database: Tests for database operations
    gcode: Tests for G-code generation and validation
    benchmark: Model precision benchmark tests (optional in CI)
    skip_ci: Tests that should be skipped in CI (require local resources)
    ijepa: Tests for I-JEPA 3D geometry extraction module
    scenario1: Integration tests for 3-view to NC code conversion
    scenario2: Integration tests for real-time machining monitoring
    scenario3: Integration tests for process planning consultation
    e2e: End-to-end full pipeline tests
    fault_recovery: Fault injection and recovery tests
    resource: Resource usage monitoring tests
    contracts: Core architecture contract tests (Task/Dataset/Plugin/Config/Observability)
