[mypy]
# 基线配置（阶段5：类型安全结构化清理）
# 目标：在不阻断重型三方库缺失的前提下，对工程自有代码做真实类型检查，
# 并通过 warn_unused_ignores 标出可安全删除的 type:ignore。
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = False
disallow_untyped_defs = False
check_untyped_defs = True
show_error_codes = True

# 已知残缺死路由文件（2026-08-03 任务B 决策）：
# app/rules/api.py 引用的领域模型（ProcessRule 等）在 database/rule_db.py 有定义，
# 但 RuleCreateRequest/RuleUpdateRequest/GroupCreateRequest/GroupUpdateRequest 等 4 个
# Pydantic 请求类与 _validate_rule_data/_build_rule_from_request 辅助函数在全仓不存在，
# 需产品决策（补全 vs 删除）。在决策前从 mypy 检查中排除，避免基线噪音。
# 其余残缺候选（曾报 name-defined 的 api/v1 文件）已全部补齐骨架并归零。
exclude = app/rules/api\.py

# 重型 / 无 stub 三方库：仅静默跳过，不报错（避免基线被噪音淹没）
[mypy-torch.*]
ignore_missing_imports = True
[mypy-torchdiffeq.*]
ignore_missing_imports = True
[mypy-onnxruntime.*]
ignore_missing_imports = True
[mypy-chromadb.*]
ignore_missing_imports = True
[mypy-tdengine.*]
ignore_missing_imports = True
[mypy-redis.*]
ignore_missing_imports = True
[mypy-cadquery.*]
ignore_missing_imports = True
[mypy-pyodbc.*]
ignore_missing_imports = True
[mypy-matplotlib.*]
ignore_missing_imports = True
[mypy-numpy.*]
ignore_missing_imports = True
