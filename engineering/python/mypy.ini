[mypy]
# 基线配置（阶段5：类型安全结构化清理）
# 目标：在不阻断重型三方库缺失的前提下，对工程自有代码做真实类型检查，
# 并通过 warn_unused_ignores 标出可安全删除的 type:ignore。
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = False
disallow_untyped_defs = False
check_untyped_defs = True
show_error_codes = True

# 重型 / 无 stub 三方库：仅静默跳过，不报错（避免基线被噪音淹没）
[mypy-torch.*]
ignore_missing_imports = True
[mypy-torchdiffeq.*]
ignore_missing_imports = True
[mypy-onnxruntime.*]
ignore_missing_imports = True
[mypy-chromadb.*]
ignore_missing_imports = True
[mypy-tdengine.*]
ignore_missing_imports = True
[mypy-redis.*]
ignore_missing_imports = True
[mypy-cadquery.*]
ignore_missing_imports = True
[mypy-pyodbc.*]
ignore_missing_imports = True
[mypy-matplotlib.*]
ignore_missing_imports = True
[mypy-numpy.*]
ignore_missing_imports = True
