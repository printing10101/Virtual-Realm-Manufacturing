name: lnn-manufacturing

services:
  lnn-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: lnn-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - DB_URL=postgresql://lnn:lnn_password@postgres:5432/lnn_db
    volumes:
      - ./models/lnn:/app/models/lnn
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "api"]
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: lnn-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - lnn-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  postgres:
    image: postgres:15-alpine
    container_name: lnn-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=lnn
      - POSTGRES_PASSWORD=lnn_password
      - POSTGRES_DB=lnn_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lnn-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: lnn-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "monitoring"]

  grafana:
    image: grafana/grafana:latest
    container_name: lnn-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "monitoring"]

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  lnn-network:
    driver: bridge
