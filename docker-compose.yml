# ============================================================
# 灵境制造（上线版） Docker Compose 配置
# ============================================================
# 使用说明：
#   1. 复制环境变量模板文件：
#        Linux / macOS :  cp .env.example .env
#        Windows (PS)  :  Copy-Item .env.example .env
#   2. 在项目根目录的 .env 中填入真实的密码、密钥等敏感值
#      （.env 文件已被 .gitignore 忽略，不会被提交到 Git 仓库）
#   3. 启动服务：
#        docker compose --profile full up -d     # 启动完整服务栈
#        docker compose --profile api up -d      # 仅启动 API
#        docker compose --profile monitoring up -d   # 仅启动监控栈
#   4. 验证配置：
#        docker compose config                   # 检查配置正确性
#
# 安全说明：
#   - 所有密码、密钥均通过 ${VAR_NAME} 形式从 .env 注入，不在本文件中硬编码
#   - Redis（6379）与 PostgreSQL（5432）不再对外暴露端口，仅容器网络内部通信
#   - 仅有 API（8000）、Grafana（3000）、Prometheus（9090）对外提供访问
# ============================================================

name: lnn-manufacturing

services:
  lnn-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: lnn-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PORT=${PORT:-8000}
      - REDIS_URL=${REDIS_URL}
      - DB_URL=${DB_URL}
    volumes:
      - ./models/lnn:/app/models/lnn
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "api"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: lnn-redis
    # Redis 仅通过容器网络 lnn-network 内部通信，不对外暴露端口
    volumes:
      - redis-data:/data
    networks:
      - lnn-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    container_name: lnn-postgres
    # PostgreSQL 仅通过容器网络 lnn-network 内部通信，不对外暴露端口
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lnn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    container_name: lnn-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "monitoring"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: lnn-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "monitoring"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  lnn-network:
    driver: bridge
