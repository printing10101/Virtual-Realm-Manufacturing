name: lnn-manufacturing

services:
  lnn-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: lnn-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - DB_URL=postgresql://lnn:lnn_password@postgres:5432/lnn_db
    volumes:
      - ./models/lnn:/app/models/lnn
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "api"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: lnn-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - lnn-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    container_name: lnn-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=lnn
      - POSTGRES_PASSWORD=lnn_password
      - POSTGRES_DB=lnn_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lnn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lnn -d lnn_db"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    container_name: lnn-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "monitoring"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: lnn-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "monitoring"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  lnn-network:
    driver: bridge
