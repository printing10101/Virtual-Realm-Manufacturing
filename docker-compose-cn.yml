# ============================================================
# 灵境制造（上线版） Docker Compose 配置 - 国内部署版
# ============================================================
# 使用说明：
#   1. 复制环境变量模板文件：
#        Linux / macOS :  cp .env.example .env
#        Windows (PS)  :  Copy-Item .env.example .env
#   2. 在项目根目录的 .env 中填入真实的密码、密钥等敏感值
#   3. 启动服务：
#        docker compose -f docker-compose-cn.yml --profile full up -d
#        docker compose -f docker-compose-cn.yml --profile api up -d
#
# 国内镜像说明：
#   - 所有基础镜像均来自华为云/阿里云公共镜像仓库
#   - pip 使用阿里云镜像源
#   - npm 使用 npmmirror 国内源
# ============================================================

name: lnn-manufacturing

services:
  lnn-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: lnn-api
    ports:
      - "8765:8765"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PORT=${PORT:-8765}
      - REDIS_URL=${REDIS_URL}
      - DB_URL=${DB_URL}
      # AI 模型配置：支持国内 API
      - AI_MODE=${AI_MODE:-local}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - CLOUD_API_KEY=${CLOUD_API_KEY:-}
      - CLOUD_BASE_URL=${CLOUD_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - CLOUD_MODEL=${CLOUD_MODEL:-qwen-plus}
    volumes:
      - ./models/lnn:/app/models/lnn
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "api"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8765/api/health/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G

  # 华为云镜像：https://console.huaweicloud.com/swr
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/library/redis:7-alpine
    container_name: lnn-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - lnn-network
    restart: unless-stopped
    command: >
      sh -c "redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass \"$${REDIS_PASSWORD}\""
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # 华为云镜像
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/library/postgres:15-alpine
    container_name: lnn-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lnn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # TDengine 国内镜像（官方提供）
  lnn-tdengine:
    image: tdengine/tdengine:3.0.7.5
    container_name: lnn-tdengine
    hostname: lnn-tdengine
    environment:
      - TAOS_FQDN=lnn-tdengine
      - TAOS_FIRST_EP=lnn-tdengine
    volumes:
      - lnn-tdengine-data:/var/lib/taos
      - lnn-tdengine-cfg:/etc/taos
    networks:
      - lnn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "taos -s 'show databases;' >/dev/null 2>&1 && curl -fsS http://localhost:6041/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Prometheus 华为云镜像
  prometheus:
    image: swr.cn-north-4.myhuaweicloud.com/prom/prometheus:latest
    container_name: lnn-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "monitoring"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Grafana 华为云镜像
  grafana:
    image: swr.cn-north-4.myhuaweicloud.com/grafana/grafana:latest
    container_name: lnn-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "monitoring"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Nginx 华为云镜像
  nginx:
    image: swr.cn-north-4.myhuaweicloud.com/library/nginx:alpine
    container_name: lnn-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      lnn-api:
        condition: service_healthy
    networks:
      - lnn-network
    restart: unless-stopped
    profiles: ["full", "api"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redis-data:
  postgres-data:
  lnn-tdengine-data:
  lnn-tdengine-cfg:
  prometheus-data:
  grafana-data:

networks:
  lnn-network:
    driver: bridge
