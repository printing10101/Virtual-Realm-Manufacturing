[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lingjing-manufacturing"
version = "0.1.0"
description = "AI-driven manufacturing desktop application"
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "RUF001", # ambiguous unicode character string (chinese comments/strings)
    "RUF002", # ambiguous unicode character docstring (chinese comments/strings)
    "RUF003", # ambiguous unicode character comment (chinese comments/strings)
    "SIM117", # multiple with statements (nested with is more readable in tests)
    "E402",  # module import not at top of file (needed for test mocks)
    "B017",  # assert raises exception (valid in test cases)
    "RUF012", # mutable class default (common in Pydantic models)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Ignore third-party libraries without type hints
[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "fastapi.*",
    "uvicorn.*",
    "pydantic.*",
    "httpx.*",
    "sqlalchemy.*",
    "reportlab.*",
    "docx.*",
    "aiofiles.*",
    "pytest.*",
    "factory.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]