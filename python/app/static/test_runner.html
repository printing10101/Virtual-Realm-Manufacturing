<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Test Runner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; }
        h1 { text-align: center; margin-bottom: 2rem; color: #38bdf8; font-size: 1.8rem; }
        #results { max-width: 900px; margin: 0 auto; }
        .section { background: #1e293b; border-radius: 8px; padding: 1.2rem; margin-bottom: 1rem; border-left: 4px solid #475569; }
        .section.pass { border-left-color: #22c55e; }
        .section.fail { border-left-color: #ef4444; }
        .section.running { border-left-color: #f59e0b; }
        .section h3 { font-size: 1rem; margin-bottom: 0.5rem; }
        .section pre { background: #0f172a; padding: 0.8rem; border-radius: 4px; font-size: 0.85rem; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
        #summary { text-align: center; padding: 1.5rem; font-size: 1.5rem; font-weight: bold; margin-top: 2rem; border-radius: 8px; }
        #summary.pass { background: #064e3b; color: #34d399; }
        #summary.fail { background: #7f1d1d; color: #fca5a5; }
        #runBtn { display: block; margin: 0 auto 2rem; padding: 0.8rem 2rem; font-size: 1.1rem; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #runBtn:hover { background: #2563eb; }
        #runBtn:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Agent Integration Tests</h1>
    <button id="runBtn" onclick="runAllTests()">Run All Tests</button>
    <div id="results"></div>
    <div id="summary"></div>

    <script>
    const BASE = "http://localhost:8000";
    let passed = 0, failed = 0;

    function logSection(title) {
        const div = document.createElement("div");
        div.className = "section running";
        div.id = "sec-" + title.replace(/\s+/g, "-");
        div.innerHTML = `<h3>${title}</h3><pre>Running...</pre>`;
        document.getElementById("results").appendChild(div);
        return div;
    }

    function setResult(el, status, msg) {
        el.className = "section " + (status === "pass" ? "pass" : "fail");
        el.querySelector("pre").textContent = msg;
    }

    async function post(url, body, headers={}) {
        const opts = { method: "POST", headers: { "Content-Type": "application/json", ...headers } };
        if (body) opts.body = JSON.stringify(body);
        return fetch(url, opts);
    }

    async function get(url, headers={}) {
        return fetch(url, { headers });
    }

    async function test(name, fn) {
        const el = logSection(name);
        try {
            await fn();
            passed++;
            setResult(el, "pass", "PASS");
        } catch (e) {
            failed++;
            setResult(el, "fail", "FAIL: " + e.message);
        }
    }

    async function runAllTests() {
        document.getElementById("runBtn").disabled = true;
        document.getElementById("results").innerHTML = "";
        document.getElementById("summary").textContent = "";
        passed = 0; failed = 0;

        // Test 1: Create RB Token
        await test("Test 1: Create RB Token", async () => {
            const r = await post(`${BASE}/api/agent/v1/tokens`, { scopes: ["R","B"], expires_in: 3600, paper_only: true });
            if (r.status !== 200) throw new Error(`Status ${r.status}: ${await r.text()}`);
            const td = await r.json();
            const tok = td.data.token;
            if (!tok.startsWith("lj_agent_")) throw new Error(`Token format: ${tok}`);
            if (tok.length !== "lj_agent_".length + 32) throw new Error(`Token length: ${tok.length}`);
        });

        // Test 2: Models List
        await test("Test 2: Models List", async () => {
            const r = await post(`${BASE}/api/agent/v1/tokens`, { scopes: ["R","B"], expires_in: 3600, paper_only: true });
            const token = (await r.json()).data.token;
            const r2 = await get(`${BASE}/api/agent/v1/models`, { "Authorization": `Bearer ${token}` });
            if (r2.status !== 200) throw new Error(`Status ${r2.status}: ${await r2.text()}`);
        });

        // Test 3: T Operation Forbidden
        await test("Test 3: T Operation Forbidden", async () => {
            const r = await post(`${BASE}/api/agent/v1/tokens`, { scopes: ["R","B"], expires_in: 3600, paper_only: true });
            const token = (await r.json()).data.token;
            const r2 = await post(`${BASE}/api/agent/v1/execute`,
                { model_name: "test", parameters: { p1: 1.0 }, paper_only: true },
                { "Authorization": `Bearer ${token}` }
            );
            if (r2.status !== 403) throw new Error(`Expected 403, got ${r2.status}: ${await r2.text()}`);
        });

        // Test 4: Paper-Only Simulation
        await test("Test 4: Paper-Only Simulation", async () => {
            const r = await post(`${BASE}/api/agent/v1/tokens`, { scopes: ["R","B","T"], expires_in: 3600, paper_only: true });
            const token = (await r.json()).data.token;
            const r2 = await post(`${BASE}/api/agent/v1/execute`,
                { model_name: "test", parameters: { p1: 1.0 } },
                { "Authorization": `Bearer ${token}`, "Idempotency-Key": `po_${Date.now()}` }
            );
            if (r2.status !== 200) throw new Error(`Status ${r2.status}: ${await r2.text()}`);
            const d = (await r2.json()).data || {};
            if (!(d.paper_only === true || d.mode === "simulation" || d.simulated === true))
                throw new Error(`Missing paper_only flag: ${JSON.stringify(d)}`);
        });

        // Test 5: Idempotency Key
        await test("Test 5: Idempotency Key", async () => {
            const r = await post(`${BASE}/api/agent/v1/tokens`, { scopes: ["R","B"], expires_in: 3600, paper_only: true });
            const token = (await r.json()).data.token;
            const key = `idem_${Date.now()}`;
            const payload = { model_name: "idem", data_path: "/tmp/test.csv" };
            const t1 = Date.now();
            const r1 = await post(`${BASE}/api/agent/v1/train`, payload, { "Authorization": `Bearer ${token}`, "Idempotency-Key": key });
            const e1 = Date.now() - t1;
            if (r1.status !== 200) throw new Error(`First train failed: ${await r1.text()}`);
            const t2 = Date.now();
            const r2 = await post(`${BASE}/api/agent/v1/train`, payload, { "Authorization": `Bearer ${token}`, "Idempotency-Key": key });
            const e2 = Date.now() - t2;
            if (r2.status !== 200) throw new Error(`Second train failed: ${await r2.text()}`);
            const j1 = (await r1.json()).data?.job_id;
            const j2 = (await r2.json()).data?.job_id;
            if (j1 !== j2) throw new Error(`job_id mismatch: ${j1} vs ${j2}`);
            if (!(e2 < e1 * 0.5)) throw new Error(`Second call not faster: ${e2}ms vs ${e1}ms`);
        });

        // Test 6: Batch Token Revocation
        await test("Test 6: Batch Token Revocation", async () => {
            const r = await post(`${BASE}/api/agent/v1/tokens`, { scopes: ["R","B"], expires_in: 3600, paper_only: true });
            const rb_token = (await r.json()).data.token;

            const t_tokens = [];
            for (let i = 0; i < 3; i++) {
                const r = await post(`${BASE}/api/agent/v1/tokens`, { scopes: ["R","T"], expires_in: 3600, paper_only: true });
                t_tokens.push((await r.json()).data.token);
            }

            const r2 = await post(`${BASE}/api/agent/v1/tokens`, { scopes: ["R","W","B"], expires_in: 3600, paper_only: true });
            const non_t_token = (await r2.json()).data.token;

            for (const tok of t_tokens) {
                const r = await get(`${BASE}/api/agent/v1/models`, { "Authorization": `Bearer ${tok}` });
                if (r.status !== 200) throw new Error(`T token should be available before revoke: ${r.status}`);
            }

            const revokeR = await post(`${BASE}/api/agent/v1/tokens/revoke-t-all`, null, { "Authorization": `Bearer ${rb_token}` });
            if (revokeR.status !== 200) throw new Error(`Revoke failed: ${await revokeR.text()}`);
            const rc = (await revokeR.json()).data?.revoked_count || 0;
            if (rc < 3) throw new Error(`Should revoke >= 3 tokens, got ${rc}`);

            for (const tok of t_tokens) {
                const r = await get(`${BASE}/api/agent/v1/models`, { "Authorization": `Bearer ${tok}` });
                if (r.status !== 401 && r.status !== 403) throw new Error(`Revoked T token still works: ${r.status}`);
            }

            const r3 = await get(`${BASE}/api/agent/v1/models`, { "Authorization": `Bearer ${non_t_token}` });
            if (r3.status !== 200) throw new Error(`Non-T token should be unaffected: ${r3.status}`);
        });

        // Test 7: Audit Log
        await test("Test 7: Audit Log Entries", async () => {
            const r = await post(`${BASE}/api/agent/v1/tokens`, { scopes: ["R","B"], expires_in: 3600, paper_only: true });
            const token = (await r.json()).data.token;
            await get(`${BASE}/api/agent/v1/models`, { "Authorization": `Bearer ${token}` });
            const r2 = await get(`${BASE}/api/agent/v1/audit-log?limit=50`, { "Authorization": `Bearer ${token}` });
            if (r2.status !== 200) throw new Error(`Status ${r2.status}: ${await r2.text()}`);
            const logs = (await r2.json()).data?.entries || [];
            if (logs.length === 0) throw new Error("Audit log should not be empty");
            const s = logs[0];
            for (const f of ["timestamp_ms","agent_id","route","permission_class","status_code","latency_ms"]) {
                if (!(f in s)) throw new Error(`Missing field: ${f}`);
            }
        });

        // Summary
        const summary = document.getElementById("summary");
        const total = passed + failed;
        summary.className = failed === 0 ? "pass" : "fail";
        summary.innerHTML = `Results: ${passed} passed, ${failed} failed, ${total} total${failed === 0 ? " — ALL TESTS PASSED!" : ""}`;
        document.getElementById("runBtn").disabled = false;
    }
    </script>
</body>
</html>
